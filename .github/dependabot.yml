version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    ignore:
      # DAGonStar is pinned to the revision DAGonWeb uses; bump both together.
      - dependency-name: dagonstar
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
